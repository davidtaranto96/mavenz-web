<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mavenz — demo</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --papel: #EEECEC; --linea: #D3CFC8; --linea-acento: #B7A28B;
    --tinta: #1E1E20; --tinta-bordo: #3C2527; --tinta-parrafo: #492F22; --tinta-apoyo: #715D55;
  }
  * { box-sizing: border-box }
  body {
    margin: 0; min-height: 100svh; display: grid; align-content: center;
    gap: 2rem; padding: clamp(1.5rem, 6vw, 6rem);
    background: var(--papel); color: var(--tinta-bordo);
    font: 400 1rem/1.6 "Urbanist", system-ui, sans-serif;
  }
  h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 700; letter-spacing: -.03em }
  p { margin: 0; max-width: 46ch; color: var(--tinta-parrafo) }
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; max-width: 34rem }
  li { border-top: 1px solid var(--linea) }
  li:last-child { border-bottom: 1px solid var(--linea) }
  a {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    min-height: 56px; padding-block: .75rem;
    color: inherit; text-decoration: none;
  }
  a span:last-child { color: var(--tinta-apoyo); font-size: .8125rem }
  a:hover span:first-child { text-decoration: underline; text-underline-offset: .25em }
  small { color: var(--tinta-apoyo); font-size: .8125rem }
</style>
</head>
<body>
  <h1>Mavenz</h1>
  <p>Demo en construcción. Tres páginas, hechas con el generador que vive en <code>demo/armar.py</code>.</p>
  <ul>
    <li><a href="demo/index.html"><span>Inicio</span><span>el relato y el universo</span></a></li>
    <li><a href="demo/about.html"><span>El equipo</span><span>quiénes mueven Mavenz</span></a></li>
    <li><a href="demo/proyectos.html"><span>Proyectos</span><span>los cuatro mundos</span></a></li>
  </ul>
  <small>DT System para Mavenz · el contenido sale de <code>demo/contenido/sitio.json</code></small>
</body>
</html>
